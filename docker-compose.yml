services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/wind
      PORT: 4000
    depends_on:
      - mongo
    ports:
      - "4000:4000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
volumes:
  mongo-data:
